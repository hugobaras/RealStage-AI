<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RealStage AI — Home staging virtuel par IA</title>
    <meta
      name="description"
      content="Meublez, remplacez le mobilier, désencombrez et sublimez vos photos immobilières en quelques secondes. Home staging virtuel par IA pour agents et mandataires."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/realstage-logo.png" />
    <script>
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem("realstage_prefs") || "{}");
          var theme =
            p.theme === "dark"
              ? "dark"
              : p.theme === "light"
                ? "light"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
